spring:
  datasource:
    url: jdbc:h2:mem:localflow-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

localflow:
  cors:
    allowed-origins:
      - http://localhost:5173
  workspace:
    root: ./build/test-workspace
    max-project-bytes: 262144000
    max-file-bytes: 31457280
    max-files: 5000
    ignored-directories:
      - .git
      - build
      - node_modules
      - target
